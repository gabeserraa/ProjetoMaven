<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments/layout :: sidebar('')}"></aside>
  <header th:replace="~{fragments/layout :: topbar}"></header>
  <main class="main" id="conteudo">
    <div class="page">
      <section class="panel offline">
        <div class="empty">
          <div class="empty-icon"><svg th:replace="~{fragments/icones :: alert}"></svg></div>
          <h3 th:text="${status == 400} ? 'Requisição inválida' : 'Não foi possível concluir a operação'">Erro</h3>
          <p th:text="|Erro ${status}. Volte e tente novamente.|">Erro.</p>
          <a class="btn primary" th:href="@{/}">Voltar ao painel</a>
        </div>
      </section>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: rodape}"></th:block>
</body>
</html>
