<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · Central de Chamados'">Central de Chamados</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E3A3B'/%3E%3Crect x='7' y='18' width='4' height='7' rx='1' fill='%23F2A73B'/%3E%3Crect x='14' y='13' width='4' height='12' rx='1' fill='%23F2A73B'/%3E%3Crect x='21' y='8' width='4' height='17' rx='1' fill='%23F2A73B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/app.js}" defer></script>
</head>

<body>

<aside th:fragment="sidebar(menu)" class="sidebar" id="sidebar">
  <a class="brand" th:href="@{/}">
    <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="brand-name">Central de<br>Chamados</span>
  </a>
  <nav class="nav" aria-label="Navegação principal">
    <a th:href="@{/}" th:classappend="${menu == 'painel'} ? active" th:attrappend="aria-current=${menu == 'painel'} ? 'page'"><svg th:replace="~{fragments/icones :: painel}"></svg>Painel</a>
    <a th:href="@{/app/chamados}" th:classappend="${menu == 'chamados'} ? active" th:attrappend="aria-current=${menu == 'chamados'} ? 'page'"><svg th:replace="~{fragments/icones :: ticket}"></svg>Chamados</a>
    <a th:href="@{/app/comentarios}" th:classappend="${menu == 'comentarios'} ? active" th:attrappend="aria-current=${menu == 'comentarios'} ? 'page'"><svg th:replace="~{fragments/icones :: chat}"></svg>Comentários</a>
    <span class="nav-group">Cadastros</span>
    <a th:href="@{/app/clientes}" th:classappend="${menu == 'clientes'} ? active" th:attrappend="aria-current=${menu == 'clientes'} ? 'page'"><svg th:replace="~{fragments/icones :: user}"></svg>Clientes</a>
    <a th:href="@{/app/tecnicos}" th:classappend="${menu == 'tecnicos'} ? active" th:attrappend="aria-current=${menu == 'tecnicos'} ? 'page'"><svg th:replace="~{fragments/icones :: wrench}"></svg>Técnicos</a>
    <a th:href="@{/app/categorias}" th:classappend="${menu == 'categorias'} ? active" th:attrappend="aria-current=${menu == 'categorias'} ? 'page'"><svg th:replace="~{fragments/icones :: tag}"></svg>Categorias</a>
  </nav>
  <p class="sidebar-foot">API REST em <code>/clientes</code>, <code>/chamados</code>…</p>
</aside>

<header th:fragment="topbar" class="topbar">
  <button type="button" class="icon-btn" id="menuBtn" aria-label="Abrir menu"><svg th:replace="~{fragments/icones :: menu}"></svg></button>
  <span class="topbar-title">Central de Chamados</span>
</header>

<th:block th:fragment="rodape">
  <div class="scrim" id="scrim" hidden></div>
  <div class="dialog" id="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" hidden>
    <h2 id="dialogTitle"></h2>
    <p id="dialogText"></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="dialogCancel">Cancelar</button>
      <button type="button" class="btn danger" id="dialogOk">Excluir</button>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite">
    <div class="toast" role="status" th:if="${sucesso}"><svg th:replace="~{fragments/icones :: check}"></svg><div th:text="${sucesso}">Salvo.</div></div>
    <div class="toast error" role="alert" th:if="${erro}"><svg th:replace="~{fragments/icones :: alert}"></svg><div th:text="${erro}">Erro.</div></div>
  </div>
</th:block>

</body>
</html>
