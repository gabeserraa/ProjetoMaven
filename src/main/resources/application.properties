spring.application.name=chamados

spring.datasource.url=jdbc:h2:mem:chamadosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Telas (Thymeleaf)
# Permite que formulários HTML enviem PUT e DELETE via campo oculto _method (th:method)
spring.mvc.hiddenmethod.filter.enabled=true
# Versiona CSS/JS pelo conteúdo: @{/css/app.css} vira /css/app-<hash>.css, então o navegador
# nunca usa um arquivo antigo em cache
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
